<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>تطبيق DINGA</title>
    <style>

        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

        h1 {

        }

            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 8px 15px;

            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في تطبيق DINGA</h1>
        <p>تم ربط الموقع بنجاح وعرضه داخل التطبيق عبر رابط GitHub Pages المباشر.</p>
        <div class="badge">يعمل بكفاءة تامة</div>

</html>
